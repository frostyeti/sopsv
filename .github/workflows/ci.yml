name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: |
          go mod download
          # Install test tools (age and sops) for integration tests
          mkdir -p bin
          curl -sL https://github.com/getsops/sops/releases/download/v3.8.1/sops-v3.8.1.linux.amd64 -o bin/sops
          chmod +x bin/sops
          curl -sL https://github.com/FiloSottile/age/releases/download/v1.1.1/age-v1.1.1-linux-amd64.tar.gz | tar -xz -C bin --strip-components=1 age/age age/age-keygen

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Run unit tests
        run: go test -v ./...

      - name: Run integration tests
        run: |
          export PATH="$PWD/bin:$PATH"
          go test -v -tags=integration ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      # - name: Generate coverage
      #   run: go test -coverprofile=coverage.out ./...
      # - name: Upload coverage
      #   uses: codecov/codecov-action@v4
