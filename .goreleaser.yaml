version: 2

project_name: sopsv

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

dist: .artifacts

archives:
  - format: tar.gz
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName | tolower }}_
      {{- .Os | tolower }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch | tolower }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

nfpms:
  - vendor: deb
    homepage: "https://github.com/frostyeti/sopsv"
    maintainer: "Frostyeti"
    description: "A local secret vault CLI using sops and age"
    license: "MIT"
    formats:
      - deb
      - rpm
      - apk
      - archlinux

snapcrafts:
  - summary: A local secret vault CLI using sops and age
    description: "Manage encrypted secrets locally using sops and age with a simple developer experience."
    publish: false # Set to true when ready to publish to snap store

brews:
  - repository:
      owner: frostyeti
      name: homebrew-tap
    homepage: "https://github.com/frostyeti/sopsv"
    description: "A local secret vault CLI using sops and age"
    license: "MIT"

scoops:
  - repository:
      owner: frostyeti
      name: scoop-bucket
    homepage: "https://github.com/frostyeti/sopsv"
    description: "A local secret vault CLI using sops and age"
    license: "MIT"

winget:
  - publisher: frostyeti
    package_identifier: "frostyeti.sopsv"
    short_description: "A local secret vault CLI using sops and age"
    license: "MIT"
    skip_upload: true
    repository:
      owner: frostyeti
      name: winget-pkgs

chocolateys:
  - name: sopsv
    title: sopsv
    authors: "frostyeti"
    project_url: "https://github.com/frostyeti/sopsv"
    description: "A local secret vault CLI using sops and age"
    tags: "cli secrets vault password-manager sops age"
    skip_publish: true

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
